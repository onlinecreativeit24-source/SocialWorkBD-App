<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কাজ পোস্ট করুন - SocialWorkBD</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="container">

    <h1>SocialWorkBD</h1>
    <p>আপনার প্রয়োজনীয় কাজের জন্য Worker খুঁজুন</p>

    <nav>
      <a href="index.html">হোম</a>
      <a href="dashboard.html">ড্যাশবোর্ড</a>
      <a href="profile.html">প্রোফাইল</a>
      <a href="#" id="logout-btn">লগআউট</a>
    </nav>

  </div>
</header>

<main class="container">

  <section class="jobs-section">

    <h2>নতুন কাজ পোস্ট করুন</h2>

    <p>
      কাজের বিস্তারিত তথ্য সঠিকভাবে লিখুন,
      যাতে Workerরা কাজটি ভালোভাবে বুঝতে পারে।
    </p>

    <form id="job-form">

      <label for="title">
        কাজের শিরোনাম
      </label>

      <input
        type="text"
        id="title"
        maxlength="100"
        placeholder="যেমন: একটি ওয়েবসাইট তৈরি করতে হবে"
        required
      >

      <label for="desc">
        কাজের বিস্তারিত
      </label>

      <textarea
        id="desc"
        rows="7"
        placeholder="কাজটি কী এবং কী কী করতে হবে বিস্তারিত লিখুন..."
        required
      ></textarea>

      <label for="budget">
        বাজেট (BDT)
      </label>

      <input
        type="number"
        id="budget"
        min="1"
        step="1"
        placeholder="যেমন: 5000"
        required
      >

      <label for="skills">
        প্রয়োজনীয় স্কিল
      </label>

      <input
        type="text"
        id="skills"
        maxlength="200"
        placeholder="যেমন: HTML, CSS, WordPress"
        required
      >

      <small>
        একাধিক স্কিল কমা (,) দিয়ে লিখতে পারেন।
      </small>

      <button type="submit">
        কাজ পোস্ট করুন
      </button>

    </form>

  </section>

</main>

<footer>

  <div class="container">

    <p>© 2026 SocialWorkBD</p>

    <p>
      বাংলাদেশি Freelance & Job Marketplace
    </p>

  </div>

</footer>

<script src="app.js"></script>

</body>
</html>
